spring.application.name=AIntegrationDemo

spring.ai.ollama.chat.options.model=qwen3-coder:30b

# Point to your local Ollama instance
# spring.ai.ollama.base-url=http://localhost:11434

# Use your specific Qwen 3 Coder tag
# spring.ai.ollama.chat.model=qwen3-coder:30b | deepseek-r1:latest | deepseek-coder-v2:latest | qwen2.5-coder:7b

# Lower temperature is recommended for coding/agentic tasks to reduce hallucinations
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.keep_alive=10m

# ----------------------------------------
# Vector Store Configuration (ChromaDB)
# ----------------------------------------
spring.ai.vectorstore.chroma.client.host=http://localhost
spring.ai.vectorstore.chroma.client.port=8000
spring.ai.vectorstore.chroma.collection-name=agentic_episodic_memory
# Instructs Spring to automatically create the collection if it doesn't exist
spring.ai.vectorstore.chroma.initialize-schema=true 

# ----------------------------------------
# Ollama Embedding Configuration
# ----------------------------------------
spring.ai.ollama.embedding.enabled=true
spring.ai.ollama.embedding.model=nomic-embed-text